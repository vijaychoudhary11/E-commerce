<button class="menu-toggle" id="menuToggle">
    ☰
</button>

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <h3 class="logo">
            🛍️ NITHARWAL STORE
        </h3>

        <p class="logo-subtitle">
            Admin Dashboard
        </p>

    </div>

    <nav class="sidebar-menu">

        <a class="sidebar-link" href="{{ url_for('admin.dashboard') }}">
            📊 Dashboard
        </a>

        <a class="sidebar-link" href="{{ url_for('admin.products') }}">
            📦 Products
        </a>

        <a class="sidebar-link" href="{{ url_for('admin.categories') }}">
            🗂 Categories
        </a>

        <a class="sidebar-link" href="{{ url_for('admin.orders') }}">
            🛒 Orders
        </a>

        <a class="sidebar-link" href="{{ url_for('admin.customers') }}">
            👥 Customers
        </a>

        <a class="sidebar-link" href="{{ url_for('admin.reviews') }}">
            ⭐ Reviews
        </a>

        <a class="sidebar-link" href="{{ url_for('admin.reports') }}">
            📈 Reports
        </a>

        <a class="sidebar-link" href="{{ url_for('admin.logout') }}">
            🚪 Logout
        </a>

    </nav>

    <div class="sidebar-footer">

        <hr>

        <strong>NITHARWAL STORE</strong>

        <br>

        <small>
            Admin Panel v1.0
        </small>

    </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const menuBtn = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");

    if (menuBtn && sidebar) {

        menuBtn.addEventListener("click", function () {

            sidebar.classList.toggle("active");

        });

        document.querySelectorAll(".sidebar-link").forEach(function (link) {

            link.addEventListener("click", function () {

                if (window.innerWidth <= 991) {

                    sidebar.classList.remove("active");

                }

            });

        });

        document.addEventListener("click", function (e) {

            if (
                window.innerWidth <= 991 &&
                !sidebar.contains(e.target) &&
                !menuBtn.contains(e.target)
            ) {

                sidebar.classList.remove("active");

            }

        });

    }

});

</script>
