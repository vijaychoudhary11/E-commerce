<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}NITHARWAL STORE Admin{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}">

    {% block extra_css %}{% endblock %}

    <style>

        /* ==========================
           ADMIN TOP NAVBAR
        ========================== */

        .admin-navbar{
            background:linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );
            border-radius:16px;
            padding:12px 18px;
            margin-bottom:25px;
        }

        .admin-brand{
            color:#fff;
            font-size:18px;
            font-weight:700;
            text-decoration:none;
        }

        .admin-brand:hover{
            color:#fff;
        }

        .admin-actions{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .admin-profile-btn{
            background:rgba(255,255,255,.1);
            color:#fff;
            border:1px solid rgba(255,255,255,.15);
            border-radius:10px;
            padding:8px 12px;
            text-decoration:none;
            font-weight:500;
        }

        .admin-profile-btn:hover{
            background:rgba(255,255,255,.2);
            color:#fff;
        }

        .admin-logout{
            border-radius:10px;
            font-weight:600;
            padding:8px 14px;
        }

        @media(max-width:576px){

            .admin-navbar{
                padding:12px;
                margin-bottom:20px;
            }

            .admin-brand{
                font-size:15px;
            }

            .admin-profile-btn{
                display:none;
            }

            .admin-logout{
                font-size:13px;
                padding:7px 10px;
            }

        }

    </style>

</head>

<body>

    {% include "admin/sidebar.html" %}


    <div class="main-content">


        <!-- ==========================
             TOP NAVBAR
        =========================== -->

        <nav class="admin-navbar">

            <div class="d-flex justify-content-between align-items-center">

                <!-- Brand -->

                <a
                    href="{{ url_for('admin.dashboard') }}"
                    class="admin-brand">

                    🛍️ NITHARWAL STORE

                    <span class="d-none d-sm-inline">
                        Admin
                    </span>

                </a>


                <!-- Actions -->

                <div class="admin-actions">

                    <!-- Profile -->

                    <a
                        href="{{ url_for('admin.admin_profile') }}"
                        class="admin-profile-btn">

                        👤 Profile

                    </a>


                    <!-- Logout -->

                    <a
                        href="{{ url_for('admin.logout') }}"
                        class="btn btn-danger admin-logout">

                        🚪 Logout

                    </a>

                </div>

            </div>

        </nav>


        <!-- ==========================
             PAGE CONTENT
        =========================== -->

        {% block content %}

        {% endblock %}


    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    {% block extra_js %}

    {% endblock %}


</body>

</html>
