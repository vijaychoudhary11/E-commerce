<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

<style>

.product-card{
    max-width:850px;
    margin:auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
}

.product-header{
    background:linear-gradient(135deg,#16a34a,#15803d);
    color:white;
    text-align:center;
    padding:30px;
}

.product-icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:white;
    color:#16a34a;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
}

.form-control,
.form-select{
    min-height:50px;
    border-radius:12px;
}

textarea.form-control{
    min-height:140px;
}

.btn{
    min-height:48px;
    border-radius:12px;
    font-weight:600;
}

.image-upload{
    border:2px dashed #cbd5e1;
    border-radius:15px;
    padding:25px;
    text-align:center;
    background:#f8fafc;
}

@media(max-width:768px){

    .product-header{
        padding:25px 15px;
    }

    .product-icon{
        width:75px;
        height:75px;
        font-size:34px;
    }

}

</style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main-content">

<div class="container-fluid mt-4">

<div class="card shadow product-card">

<!-- Header -->

<div class="product-header">

<div class="product-icon">

➕

</div>

<h2 class="mt-3">

Add New Product

</h2>

<p class="mb-0">

Add a new product to NITHARWAL STORE

</p>

</div>


<!-- Form -->

<div class="card-body p-4">

<form method="POST"
      enctype="multipart/form-data">


<!-- Product Name -->

<div class="mb-4">

<label class="form-label fw-bold">

📦 Product Name

</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter product name"
required>

</div>


<!-- Slug -->

<div class="mb-4">

<label class="form-label fw-bold">

🔗 Product Slug

</label>

<input
type="text"
name="slug"
class="form-control"
placeholder="product-slug"
required>

<small class="text-muted">

Example: men's-black-tshirt

</small>

</div>


<!-- Category -->

<div class="mb-4">

<label class="form-label fw-bold">

🗂 Category

</label>

<select
name="category_id"
class="form-select"
required>

<option value="">

Select Category

</option>

{% for category in categories %}

<option value="{{ category.id }}">

{{ category.name }}

</option>

{% endfor %}

</select>

</div>


<!-- Price + Stock -->

<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label fw-bold">

💰 Price

</label>

<div class="input-group">

<span class="input-group-text">

₹

</span>

<input
type="number"
step="0.01"
min="0"
name="price"
class="form-control"
placeholder="Enter price"
required>

</div>

</div>


<div class="col-md-6 mb-4">

<label class="form-label fw-bold">

📦 Stock

</label>

<input
type="number"
name="stock"
class="form-control"
placeholder="Enter stock quantity"
min="0"
required>

</div>

</div>


<!-- Description -->

<div class="mb-4">

<label class="form-label fw-bold">

📝 Description

</label>

<textarea
name="description"
class="form-control"
placeholder="Enter product description"></textarea>

</div>


<!-- Image -->

<div class="mb-4">

<label class="form-label fw-bold">

🖼️ Product Image

</label>

<div class="image-upload">

<div style="font-size:45px;">

📷

</div>

<p class="text-muted mb-3">

Upload product image

</p>

<input
type="file"
name="image"
class="form-control"
accept="image/*">

<small class="text-muted d-block mt-2">

JPG, JPEG, PNG or WEBP

</small>

</div>

</div>


<!-- Buttons -->

<div class="row">

<div class="col-md-6 mb-3">

<button
type="submit"
class="btn btn-success w-100">

💾 Save Product

</button>

</div>

<div class="col-md-6 mb-3">

<a
href="{{ url_for('admin.products') }}"
class="btn btn-secondary w-100">

⬅ Back to Products

</a>

</div>

</div>

</form>

</div>

</div>


<!-- Footer -->

<footer class="bg-dark text-white text-center py-4 mt-5 rounded">

<h5 class="mb-2">

🛍️ NITHARWAL STORE

</h5>

<p class="mb-1">

Admin Dashboard

</p>

<small>

© 2026 NITHARWAL STORE<br>

Designed & Developed by
<strong>Vijay Nitharwal</strong>

</small>

</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
