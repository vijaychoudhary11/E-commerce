<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

<style>

.edit-card{
    max-width:650px;
    margin:auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
}

.edit-header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    text-align:center;
    padding:30px;
}

.profile-avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:white;
    color:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    font-weight:bold;
    margin:auto;
}

.form-control{
    height:50px;
    border-radius:12px;
}

.btn{
    height:48px;
    border-radius:12px;
    font-weight:600;
}

@media(max-width:768px){

.edit-header{
    padding:25px;
}

.profile-avatar{
    width:75px;
    height:75px;
    font-size:30px;
}

}

</style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main-content">

<div class="container-fluid mt-4">

<div class="card shadow edit-card">

<div class="edit-header">

<div class="profile-avatar">

{{ admin.username[0]|upper }}

</div>

<h2 class="mt-3">

Edit Profile

</h2>

<p class="mb-0">

Update your account information

</p>

</div>

<div class="card-body p-4">

<form method="POST">

<div class="mb-4">

<label class="form-label fw-bold">

👤 Username

</label>

<input
type="text"
name="username"
value="{{ admin.username }}"
class="form-control"
required>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

📧 Email Address

</label>

<input
type="email"
name="email"
value="{{ admin.email }}"
class="form-control"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<button
type="submit"
class="btn btn-success w-100">

💾 Save Changes

</button>

</div>

<div class="col-md-6 mb-3">

<a
href="{{ url_for('admin.profile') }}"
class="btn btn-secondary w-100">

⬅ Back

</a>

</div>

</div>

</form>

</div>

</div>

<footer class="bg-dark text-white text-center py-4 mt-5 rounded">

<h5 class="mb-2">

🛍️ NITHARWAL STORE

</h5>

<p class="mb-1">

Admin Dashboard

</p>

<small>

© 2026 NITHARWAL STORE<br>

Designed & Developed by <strong>Vijay Nitharwal</strong>

</small>

</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
