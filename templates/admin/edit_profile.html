<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            <h3>✏️ Edit Profile</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        value="{{ admin.username }}"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ admin.email }}"
                        class="form-control"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-success">
                    Save Changes
                </button>

                <a href="/admin/profile"
                   class="btn btn-secondary">
                   Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
