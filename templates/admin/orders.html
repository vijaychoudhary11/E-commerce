<!DOCTYPE html>
<html>
<head>
    <title>Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

{% include 'admin/sidebar.html' %}

<div class="main-content">

    <div class="container-fluid mt-4">

<h1 class="mb-4 text-center">
📦 All Orders
</h1>

<div class="card shadow">
<div class="card-body">

<div class="table-responsive">

<table class="table table-hover table-striped align-middle">
    <tr class="table-dark">
        <th>ID</th>
        <th>Order Number</th>
        <th>Customer</th>
        <th>Phone</th>
        <th>Total</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for order in orders %}
    <tr>
        <td>{{ order.id }}</td>
        <td>{{ order.order_number }}</td>
        <td>{{ order.customer_name }}</td>
        <td>{{ order.customer_phone }}</td>
        <td>₹ {{ order.grand_total }}</td>

        <td>

<form method="POST"
      action="/admin/orders/update-status/{{ order.id }}">

    <select name="order_status"
            class="form-select"
            onchange="this.form.submit()">

        <option value="Pending"
        {% if order.order_status == "Pending" %}selected{% endif %}>
        Pending
        </option>

        <option value="Confirmed"
        {% if order.order_status == "Confirmed" %}selected{% endif %}>
        Confirmed
        </option>

        <option value="Shipped"
        {% if order.order_status == "Shipped" %}selected{% endif %}>
        Shipped
        </option>

        <option value="Delivered"
        {% if order.order_status == "Delivered" %}selected{% endif %}>
        Delivered
        </option>

    </select>

</form>

</td>

        <td>
                <button type="submit"
class="btn btn-success btn-sm">
    ✓ Update
</button>
            </form>

            <a href="{{ url_for('admin.order_details', order_id=order.id) }}"
class="btn btn-info btn-sm">
    👁 View
</a>
        </td>
    </tr>
    {% endfor %}
</table>

</div>
</div>
</div>

</div>

</body>
</html>
