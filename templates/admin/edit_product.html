<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

<style>

.product-card{
    max-width:850px;
    margin:auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
}

.product-header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    text-align:center;
    padding:30px;
}

.product-icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:white;
    color:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
}

.form-control,
.form-select{
    height:50px;
    border-radius:12px;
}

textarea.form-control{
    min-height:140px;
    height:auto;
}

.btn{
    height:48px;
    border-radius:12px;
    font-weight:600;
}

.current-image{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid #ddd;
}

@media(max-width:768px){

.product-header{
    padding:25px;
}

.product-icon{
    width:75px;
    height:75px;
    font-size:34px;
}

.current-image{
    width:100px;
    height:100px;
}

}

</style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main-content">

<div class="container-fluid mt-4">

<div class="card shadow product-card">

<div class="product-header">

<div class="product-icon">

📦

</div>

<h2 class="mt-3">

Edit Product

</h2>

<p class="mb-0">

Update your product details

</p>

</div>

<div class="card-body p-4">

<form method="POST" enctype="multipart/form-data">

<div class="mb-4">

<label class="form-label fw-bold">

📦 Product Name

</label>

<input
type="text"
name="name"
class="form-control"
value="{{ product.name }}"
required>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

🔗 Product Slug

</label>

<input
type="text"
name="slug"
class="form-control"
value="{{ product.slug }}"
required>

</div>

<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label fw-bold">

💰 Price

</label>

<input
type="number"
step="0.01"
name="price"
class="form-control"
value="{{ product.price }}"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label fw-bold">

📦 Stock

</label>

<input
type="number"
name="stock"
class="form-control"
value="{{ product.stock }}"
required>

</div>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

🗂 Category

</label>

<select
name="category_id"
class="form-select"
required>

{% for category in categories %}

<option
value="{{ category.id }}"
{% if product.category_id==category.id %}selected{% endif %}>

{{ category.name }}

</option>

{% endfor %}

</select>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

📝 Description

</label>

<textarea
name="description"
class="form-control">{{ product.description }}</textarea>

</div>

{% if product.image_1 %}

<div class="mb-4 text-center">

<label class="form-label fw-bold d-block">

Current Image

</label>

<img
src="{{ product.image_1 }}"
class="current-image">

</div>

{% endif %}

<div class="mb-4">

<label class="form-label fw-bold">

🖼 Change Image

</label>

<input
type="file"
name="image"
class="form-control">

</div>

<div class="row">

<div class="col-md-6 mb-3">

<button
type="submit"
class="btn btn-success w-100">

💾 Update Product

</button>

</div>

<div class="col-md-6 mb-3">

<a
href="{{ url_for('admin.products') }}"
class="btn btn-secondary w-100">

⬅ Back

</a>

</div>

</div>

</form>

</div>

</div>

<footer class="bg-dark text-white text-center py-4 mt-5 rounded">

<h5 class="mb-2">

🛍️ NITHARWAL STORE

</h5>

<p class="mb-1">

Admin Dashboard

</p>

<small>

© 2026 NITHARWAL STORE<br>

Designed & Developed by <strong>Vijay Nitharwal</strong>

</small>

</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
