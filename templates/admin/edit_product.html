<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
</head>
<body>

<h1>Edit Product</h1>

<form method="POST" enctype="multipart/form-data">

    <input
        type="text"
        name="name"
        value="{{ product.name }}"
        required
    >

    <br><br>

    <input
        type="text"
        name="slug"
        value="{{ product.slug }}"
        required
    >

    <br><br>

    <input
        type="number"
        step="0.01"
        name="price"
        value="{{ product.price }}"
        required
    >

    <br><br>

    <input
        type="number"
        name="stock"
        value="{{ product.stock }}"
        required
    >

    <br><br>

<div class="mb-3">
    <label>Category</label>

    <select name="category_id" class="form-control" required>

        {% for category in categories %}

        <option value="{{ category.id }}"
        {% if product.category_id == category.id %}selected{% endif %}>
            {{ category.name }}
        </option>

        {% endfor %}

    </select>
</div>

    <textarea
        name="description"
    >{{ product.description }}</textarea>

    <br><br>

    <div class="mb-3">
    <label>New Image</label>

    <input
        type="file"
        name="image"
        class="form-control">
</div>

    <button type="submit">
        Update Product
    </button>

</form>

</body>
</html>
