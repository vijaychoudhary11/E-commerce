<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#2563eb,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI,sans-serif;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    padding:35px 25px;
}

.logo{
    font-size:55px;
    text-align:center;
    margin-bottom:10px;
}

h2{
    text-align:center;
    font-weight:700;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#6c757d;
    margin-bottom:30px;
}

.form-control{
    height:50px;
    border-radius:12px;
    font-size:16px;
}

.btn-login{
    height:50px;
    border-radius:12px;
    font-size:17px;
    font-weight:600;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#6c757d;
    font-size:14px;
}

@media(max-width:576px){

.login-card{
    padding:25px 18px;
}

.logo{
    font-size:45px;
}

h2{
    font-size:28px;
}

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
🛍️
</div>

<h2>

NITHARWAL STORE

</h2>

<p class="subtitle">

Admin Dashboard Login

</p>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter your password"
required>

</div>

<button
type="submit"
class="btn btn-primary btn-login w-100">

🔐 Login

</button>

</form>

<div class="footer">

© 2026 NITHARWAL STORE

<br>

Designed & Developed by <strong>Vijay Nitharwal</strong>

</div>

</div>

</body>

</html>
