<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Change Password</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

<style>

.password-card{
    max-width:650px;
    margin:auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
}

.password-header{
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:white;
    text-align:center;
    padding:30px;
}

.password-icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:white;
    color:#d97706;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

.form-control{
    min-height:50px;
    border-radius:12px;
    font-size:16px;
}

.btn{
    min-height:48px;
    border-radius:12px;
    font-weight:600;
}

.password-note{
    background:#fff7ed;
    border:1px solid #fed7aa;
    border-radius:12px;
    padding:15px;
    color:#9a3412;
}

@media(max-width:768px){

    .password-header{
        padding:25px 15px;
    }

    .password-icon{
        width:75px;
        height:75px;
        font-size:34px;
    }

}

</style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main-content">

<div class="container-fluid mt-4">

<div class="card shadow password-card">


<!-- HEADER -->

<div class="password-header">

<div class="password-icon">

🔐

</div>

<h2 class="mt-3">

Change Password

</h2>

<p class="mb-0">

Keep your admin account secure

</p>

</div>


<!-- BODY -->

<div class="card-body p-4">


<div class="password-note mb-4">

<strong>🔒 Security Tip</strong>

<br>

Use a strong password containing letters,
numbers and special characters.

</div>


<form method="POST">


<!-- OLD PASSWORD -->

<div class="mb-4">

<label class="form-label fw-bold">

🔑 Current Password

</label>

<input
type="password"
name="old_password"
class="form-control"
placeholder="Enter current password"
autocomplete="current-password"
required>

</div>


<!-- NEW PASSWORD -->

<div class="mb-4">

<label class="form-label fw-bold">

🔐 New Password

</label>

<input
type="password"
name="new_password"
class="form-control"
placeholder="Enter new password"
autocomplete="new-password"
required>

</div>


<!-- CONFIRM PASSWORD -->

<div class="mb-4">

<label class="form-label fw-bold">

🔐 Confirm New Password

</label>

<input
type="password"
name="confirm_password"
class="form-control"
placeholder="Confirm new password"
autocomplete="new-password"
required>

</div>


<!-- BUTTONS -->

<div class="row">

<div class="col-md-6 mb-3">

<button
type="submit"
class="btn btn-success w-100">

🔄 Update Password

</button>

</div>

<div class="col-md-6 mb-3">

<a
href="{{ url_for('admin.admin.profile') }}"
class="btn btn-secondary w-100">

⬅ Back to Profile

</a>

</div>

</div>


</form>

</div>

</div>


<!-- FOOTER -->

<footer
class="bg-dark text-white text-center py-4 mt-5 rounded">

<h5 class="mb-2">

🛍️ NITHARWAL STORE

</h5>

<p class="mb-1">

Admin Dashboard

</p>

<small>

© 2026 NITHARWAL STORE<br>

Designed & Developed by
<strong>Vijay Nitharwal</strong>

</small>

</footer>


</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
