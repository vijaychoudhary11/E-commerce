<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Add Category</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/admin.css') }}">

<style>

.category-card{
    max-width:700px;
    margin:auto;
    border:none;
    border-radius:20px;
    overflow:hidden;
}

.category-header{
    background:linear-gradient(135deg,#16a34a,#15803d);
    color:white;
    text-align:center;
    padding:30px;
}

.category-icon{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:white;
    color:#16a34a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

.form-control{
    min-height:50px;
    border-radius:12px;
}

textarea.form-control{
    min-height:140px;
}

.btn{
    min-height:48px;
    border-radius:12px;
    font-weight:600;
}

@media(max-width:768px){

    .category-header{
        padding:25px 15px;
    }

    .category-icon{
        width:75px;
        height:75px;
        font-size:34px;
    }

}

</style>

</head>

<body>

{% include "admin/sidebar.html" %}

<div class="main-content">

<div class="container-fluid mt-4">

<div class="card shadow category-card">

<!-- Header -->

<div class="category-header">

<div class="category-icon">

🗂️

</div>

<h2 class="mt-3">

Add New Category

</h2>

<p class="mb-0">

Create a new product category

</p>

</div>


<!-- Form -->

<div class="card-body p-4">

<form method="POST">


<!-- Category Name -->

<div class="mb-4">

<label class="form-label fw-bold">

📝 Category Name

</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter category name"
required>

</div>


<!-- Category Slug -->

<div class="mb-4">

<label class="form-label fw-bold">

🔗 Category Slug

</label>

<input
type="text"
name="slug"
class="form-control"
placeholder="category-slug"
required>

<small class="text-muted">

Example: men's-clothing

</small>

</div>


<!-- Description -->

<div class="mb-4">

<label class="form-label fw-bold">

📄 Description

</label>

<textarea
name="description"
class="form-control"
placeholder="Enter category description"></textarea>

</div>


<!-- Buttons -->

<div class="row">

<div class="col-md-6 mb-3">

<button
type="submit"
class="btn btn-success w-100">

💾 Save Category

</button>

</div>

<div class="col-md-6 mb-3">

<a
href="{{ url_for('admin.categories') }}"
class="btn btn-secondary w-100">

⬅ Back to Categories

</a>

</div>

</div>

</form>

</div>

</div>


<!-- Footer -->

<footer
class="bg-dark text-white text-center py-4 mt-5 rounded">

<h5 class="mb-2">

🛍️ NITHARWAL STORE

</h5>

<p class="mb-1">

Admin Dashboard

</p>

<small>

© 2026 NITHARWAL STORE<br>

Designed & Developed by
<strong>Vijay Nitharwal</strong>

</small>

</footer>

</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
