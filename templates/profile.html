<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center"
     style="min-height:80vh;">

    <div class="card shadow-lg p-4" style="width:500px;">

        <div class="text-center">

            <h2 class="mb-3">👤 My Profile</h2>

            <h4 class="text-primary">
                {{ customer.full_name }}
            </h4>

            <hr>

        </div>

        <p>
            <strong>Email:</strong>
            {{ customer.email }}
        </p>

        <p>
            <strong>Mobile:</strong>
            {{ customer.mobile }}
        </p>

        <p>
            <strong>Joined:</strong>
            {{ customer.created_at }}
        </p>

        <div class="d-grid gap-2 mt-3">

            <a href="{{ url_for('customer.edit_profile') }}"
               class="btn btn-warning">
                Edit Profile
            </a>

            <a href="{{ url_for('customer.order_history') }}"
               class="btn btn-primary">
                My Orders
            </a>

            <a href="{{ url_for('customer.logout') }}"
               class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">

    © 2026 NITHARWAL STORE by Kamlesh Nitharwal
    <br>
    Designed by Vijay Nitharwal

</footer>

</body>
</html>
