<!DOCTYPE html>
<html>

<head>

    <title>Checkout</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fb;
        }

        .checkout-card{
            max-width:600px;
            margin:auto;
            margin-top:40px;
            border-radius:18px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

    </style>

</head>

<body>

<div class="container py-4">

<div class="card checkout-card">

<div class="card-body p-4">

<h2 class="text-center mb-4">
🛍️ Checkout
</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label fw-bold">

Full Name

</label>

<input
type="text"
name="customer_name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label fw-bold">

Phone Number

</label>

<input
type="text"
name="customer_phone"
class="form-control"
placeholder="Enter your phone number"
required>

</div>

<div class="mb-3">

<label class="form-label fw-bold">

Delivery Address

</label>

<textarea
name="address"
class="form-control"
rows="4"
placeholder="Enter complete delivery address"
required></textarea>

</div>

<button
type="submit"
class="btn btn-success w-100 mb-2">

Continue to Payment

</button>

<a
href="/cart"
class="btn btn-secondary w-100">

⬅ Back to Cart

</a>

</form>

</div>

</div>

</div>

</body>

</html>
