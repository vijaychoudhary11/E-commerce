<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
    font-family:'Poppins',sans-serif;
}

.register-container{
    max-width:550px;
    margin:auto;
    padding:35px 15px;
}

.register-card{
    border:none;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.register-header{
    background:linear-gradient(135deg,#198754,#20c997);
    color:white;
    text-align:center;
    padding:35px 20px;
}

.store-logo{
    font-size:55px;
}

.register-title{
    margin-top:10px;
    font-size:30px;
    font-weight:700;
}

.register-subtitle{
    opacity:.9;
}

.register-body{
    padding:28px;
}

.form-control{
    height:50px;
    border-radius:12px;
}

.btn-custom{
    border-radius:12px;
    height:50px;
    font-weight:600;
}

.password-box{
    position:relative;
}

.password-toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    user-select:none;
}

</style>

</head>

<body>

<div class="register-container">

<div class="card register-card">

<div class="register-header">

<div class="store-logo">

🛍️

</div>

<div class="register-title">

Create Account

</div>

<div class="register-subtitle">

Join NITHARWAL STORE today

</div>

</div>

<div class="register-body">

<form method="POST">

<div class="mb-3">

<label class="form-label fw-bold">

👤 Full Name

</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label fw-bold">

📧 Email Address

</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

🔒 Password

</label>

<div class="password-box">

<input
type="password"
id="password"
name="password"
class="form-control"
placeholder="Create a password"
required>

<span
class="password-toggle"
onclick="togglePassword()">

👁️

</span>

</div>

</div>

<button
type="submit"
class="btn btn-success btn-custom w-100">

Create Account

</button>


<hr class="my-4">

<p class="text-center mb-3">

Already have an account?

<a
href="{{ url_for('customer.login') }}"
class="fw-bold text-decoration-none">

Login Here

</a>

</p>

<div class="d-grid gap-2">

<a
href="/"
class="btn btn-primary btn-custom">

🛍 Continue Shopping

</a>

<a
href="/"
class="btn btn-outline-dark btn-custom">

🏠 Back to Home

</a>

</div>

</form>

</div>

</div>

</div>

<footer class="bg-dark text-white text-center py-4 mt-5">

<h5 class="mb-2">

🛍 NITHARWAL STORE

</h5>

<p class="mb-1">

Fashion for Everyone

</p>

<small>

© 2026 NITHARWAL STORE<br>

Designed & Developed by <b>Vijay Nitharwal</b>

</small>

</footer>

<script>

function togglePassword(){

const password =
document.getElementById("password");

if(password.type==="password"){

password.type="text";

}else{

password.type="password";

}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
